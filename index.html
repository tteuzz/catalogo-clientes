<style>

  color-scheme:dark}}
*{box-sizing:border-box}

.overlay{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(920px,100%);height:100%;overflow-y:auto;overscroll-behavior:contain;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.sheet.narrow{width:min(520px,100%)}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:calc(env(safe-area-inset-top,0px) + 10px) 10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

.sheet-body{padding-block:18px calc(env(safe-area-inset-bottom,0px) + 40px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

.hero{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:720px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .thumb{border-radius:10px;border:1px solid var(--line)}
.hero-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.prod-name{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,30px);line-height:1.1;letter-spacing:-.015em;margin:0;text-wrap:balance}
.pricebox{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-radius:10px;padding:12px 14px}
.pricebox small{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kv div{background:var(--soft);border-radius:8px;padding:8px 10px;min-width:0}
.kv small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.item{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.25;min-width:0}
.item .thumb{border-radius:8px;border:1px solid var(--line)}
.item small{color:var(--muted);font-family:var(--f-mono)}
.tablewrap{overflow-x:auto}
table.prices{border-collapse:collapse;width:100%;font-size:14px;min-width:440px}
table.prices th,table.prices td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}

.pos{color:var(--good)}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}

/* barra do pedido */
.bagbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:15;width:min(560px,calc(100% - 24px));display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;box-shadow:0 8px 30px rgba(0,0,0,.25)}

.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:15;width:56px;height:56px;border-radius:50%;background:var(--wa);color:var(--wa-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(0,0,0,.25)}

.bagitem .nm{font-weight:600;font-size:14px;line-height:1.25}

.bagitem .stepper{min-height:36px;flex:none;width:112px}
.bagitem .stepper button{width:34px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-weight:800;font-size:22px;padding-top:4px}

<script>
const MODE="revenda";
const PHONE='5511954023947';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL=v=>(isFinite(v)?v:0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const NUM=v=>(isFinite(v)?v:0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const D=window.CATALOGO||{catalogs:[],products:[],config:{}}, C=D.config||{};
const REV = MODE==='revenda';
const CAT={red:'var(--cat-red)',green:'var(--cat-green)',gold:'var(--cat-gold)',blue:'var(--cat-blue)',plum:'var(--cat-plum)',teal:'var(--cat-teal)'};
const WA_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>';

const T = REV ? {
  h1:'Catálogo de <span>Revenda</span>',
  sub:'Peças impressas em 3D sob encomenda, com preço especial para revender. Veja quanto você paga e quanto cobrar em cada plataforma.',
  how:[['Escolha','Monte seu pedido com as quantidades de cada peça.'],['Envie no WhatsApp','A lista vai pronta, com seu preço e o total.'],['Revenda com lucro','Use o preço sugerido para anunciar no Mercado Livre, Shopee e TikTok.']],
  price:'Seu preço', priceLong:'Seu preço por unidade',
  waTop:'Olá! Vi o catálogo de revenda de peças 3D e quero mais informações.',
  orderHead:'Olá! Sou revendedor e quero fazer um pedido pelo catálogo de revenda:',
  key:'pedido-revenda'
} : {
  h1:'Decoração de Natal <span>3D</span>',
  sub:'Peças impressas em 3D sob encomenda, feitas uma a uma com cores reais do filamento. Escolha, monte seu pedido e finalize pelo WhatsApp.',
  how:[['Escolha','Adicione as peças e kits que quiser ao seu pedido.'],['Envie no WhatsApp','Sua lista chega pronta para combinar cores, pagamento e entrega.'],['Receba','Produção em poucos dias úteis, com pagamento por Pix.']],
  price:'Preço', priceLong:'Preço',
  waTop:'Olá! Vi o catálogo de decoração 3D e quero fazer um pedido.',
  orderHead:'Olá! Quero fazer este pedido pelo catálogo:',
  key:'pedido-vitrine'
};
let PRICES={}, active=(D.catalogs.length===1?D.catalogs[0].id:'all'), kind='all', openId=null, toastT=0;
const byId=id=>D.products.find(p=>p.id===id);
const isKit=p=>!!(p.kitItems&&p.kitItems.length);
const priceOf=p=>PRICES[p.id]||0;
const pageUrl=()=>location.href.split('#')[0];
function waLink(text){ return 'https://wa.me/'+PHONE+'?text='+encodeURIComponent(text); }
function toast(t){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=t; document.body.appendChild(el); clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),2200); }
function img(p,alt=true,lazy=false){ return '<img src="'+esc(p.image)+'" alt="'+(alt?esc(p.name):'')+'"'+(lazy?' loading="lazy"':'')+' decoding="async">'; }
function prazo(p){ const m=/Produ[cç][aã]o em at[eé] (\d+) dias? [uú]teis/i.exec(p.description||''); return m?+m[1]:0; }
function kitParts(p){ return isKit(p)?p.kitItems.map(byId).filter(Boolean):[]; }
function kitSeparate(p){ const ps=kitParts(p); if(!ps.length||ps.some(x=>!priceOf(x))) return 0; return ps.reduce((a,x)=>a+priceOf(x),0); }
function kitSave(p){ const s=kitSeparate(p), v=priceOf(p); return s&&v&&s-v>=1 ? s-v : 0; }
function swatches(p,max=8){ const c=(p.colors||[]).slice(0,max); return c.length?'<div class="swatches" aria-label="Cores: '+esc(p.colorText||'')+'">'+c.map(x=>'<span class="sw" style="background:'+esc(x)+'"></span>').join('')+'</div>':''; }

/* preços: planilha precos.csv (última coluna) */
async function loadPrices(){
  try{ const t=await fetch('precos.csv?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'');
    t.split(/\r?\n/).slice(1).forEach(l=>{ const p=l.split(';'); if(p.length<3) return; const v=parseFloat(p[p.length-1].trim().replace(/[R$\s]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.')); if(p[0].trim()&&isFinite(v)&&v>0) PRICES[p[0].trim()]=v; });
  }catch(e){}
  render(); renderBag(); if(openId) renderDetail();
}

/* revenda: preço sugerido por plataforma */
const P=v=>(+v||0)/100;
function platforms(){
  const ml=pct=>[{min:0,max:79,pct:P(pct),fix:+C.mlCustoOp||0},{min:79,max:Infinity,pct:P(pct),fix:+C.mlFrete||0}];
  const tk=(C.tkLow&&C.tkHigh)?[{min:0,max:50,pct:P(C.tkLow[0]),fix:+C.tkLow[1]},{min:50,max:Infinity,pct:P(C.tkHigh[0]),fix:+C.tkHigh[1]}]:[];
  return [
    {name:'Mercado Livre',sub:'Anúncio Clássico',tiers:ml(C.mlClassico),extra:0},
    {name:'Mercado Livre',sub:'Anúncio Premium (parcelado)',tiers:ml(C.mlPremium),extra:0},
    {name:'Shopee',sub:'Comissão + tarifa por item',tiers:(C.sh||[]).map(t=>({min:t[0],max:t[1]>=1e9?Infinity:t[1],pct:P(t[2]),fix:+t[3]})),extra:0},
    {name:'TikTok Shop',sub:'Comissão + programa de frete',tiers:tk,extra:P(C.tkFrete)},
  ].filter(x=>x.tiers.length);
}
const round90=p=>Math.ceil(p+0.10)-0.10;
function resale(p){
  const cost=priceOf(p)+(+C.resalePack||0), m=P(C.resaleMargin||25);
  return platforms().map(pl=>{
    const c=[]; for(const t of pl.tiers){ const den=1-t.pct-pl.extra-m; if(den<=0.01) continue; const v=(cost+t.fix)/den; if(v>=t.min&&v<t.max) c.push(v); else if(v<t.min) c.push(t.min); }
    if(!c.length||!priceOf(p)) return {pl,bad:true};
    const price=round90(Math.min(...c)), t=pl.tiers.find(t=>price>=t.min&&price<t.max)||pl.tiers[pl.tiers.length-1];
    const fees=price*(t.pct+pl.extra)+t.fix, profit=price-fees-cost;
    return {pl,price,fees,profit};
  });
}

/* pedido (fica salvo neste navegador) */
let BAG={};
try{ BAG=JSON.parse(localStorage.getItem(T.key)||'{}')||{}; }catch(e){ BAG={}; }
function saveBag(){ try{ localStorage.setItem(T.key,JSON.stringify(BAG)); }catch(e){} }
function qtyOf(id){ return BAG[id]||0; }
function setQty(id,q){ q=Math.max(0,Math.min(999,Math.round(q)||0)); if(q) BAG[id]=q; else delete BAG[id]; saveBag(); render(); renderBag(); if(openId) renderDetail(); if(!$('bagOv').hidden) renderBagSheet(); }
function bagLines(){ return Object.keys(BAG).map(id=>({p:byId(id),q:BAG[id]})).filter(x=>x.p&&x.q>0); }
function bagTotal(){ return bagLines().reduce((a,x)=>a+priceOf(x.p)*x.q,0); }
function bagCount(){ return bagLines().reduce((a,x)=>a+x.q,0); }
function orderText(lines, extra){
  const L=lines.map(x=>'• '+x.q+'x '+x.p.name+(priceOf(x.p)?' — '+BRL(priceOf(x.p))+(x.q>1?' cada = '+BRL(priceOf(x.p)*x.q):''):''));
  const tot=lines.reduce((a,x)=>a+priceOf(x.p)*x.q,0);
  let t=T.orderHead+'\n\n'+L.join('\n')+(tot?'\n\nTotal: '+BRL(tot):'');
  if(extra&&extra.name) t+='\n\nNome: '+extra.name;
  if(extra&&extra.city) t+='\nCidade: '+extra.city;
  if(extra&&extra.obs) t+='\nObservações: '+extra.obs;
  return t+'\n\nCatálogo: '+pageUrl();
}
function oneText(p,q){ return orderText([{p,q:q||1}]).replace(T.orderHead, REV?'Olá! Sou revendedor e tenho interesse em:':'Olá! Tenho interesse em:')+'\nPode me passar cores e prazo?'; }
function stepper(id,q,label){ return '<div class="stepper" role="group" aria-label="Quantidade de '+esc(label)+'"><button type="button" data-dec="'+esc(id)+'" aria-label="Diminuir">−</button><span aria-live="polite">'+q+'</span><button type="button" data-inc="'+esc(id)+'" aria-label="Aumentar">+</button></div>'; }
function bindSteppers(root){
  root.querySelectorAll('[data-inc]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); setQty(b.dataset.inc,qtyOf(b.dataset.inc)+1); });
  root.querySelectorAll('[data-dec]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); setQty(b.dataset.dec,qtyOf(b.dataset.dec)-1); });
  root.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); setQty(b.dataset.add,qtyOf(b.dataset.add)+1); toast('Adicionado ao pedido'); });
}

/* lista */
function render(){
  const inCat=p=>active==='all'||p.catalogId===active;
  const kits=D.products.filter(p=>inCat(p)&&isKit(p)).length, pieces=D.products.filter(p=>inCat(p)&&!isKit(p)).length;
  const count=id=>D.products.filter(p=>id==='all'||p.catalogId===id).length;
  $('filters').innerHTML=(D.catalogs.length>1?'<button class="chip" type="button" data-c="all" aria-pressed="'+(active==='all')+'">Todos <span class="c">'+count('all')+'</span></button>':'')+
    (D.catalogs.length>1?D.catalogs:[]).map(c=>'<button class="chip" type="button" data-c="'+esc(c.id)+'" aria-pressed="'+(active===c.id)+'"><span class="dot" style="background:'+(CAT[c.color]||CAT.teal)+'"></span>'+esc(c.name)+' <span class="c">'+count(c.id)+'</span></button>').join('')+
    (kits&&pieces?(D.catalogs.length>1?'<span class="sep" aria-hidden="true"></span>':'')+[['all','Tudo'],['piece','Peças avulsas',pieces],['kit','Kits',kits]].map(k=>'<button class="chip" type="button" data-k="'+k[0]+'" aria-pressed="'+(kind===k[0])+'">'+k[1]+(k[2]?' <span class="c">'+k[2]+'</span>':'')+'</button>').join(''):'');
  $('filters').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{active=b.dataset.c; render();});
  $('filters').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k; render();});
  const q=$('q').value.trim().toLowerCase(), s=$('sort').value;
  const norm=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  let list=D.products.filter(p=>inCat(p)&&(kind==='all'||(kind==='kit')===isKit(p))&&(!q||norm(p.name+' '+(p.description||'')+' '+(p.colorText||'')).includes(norm(q))));
  list.sort((a,b)=>s==='price'?priceOf(a)-priceOf(b):s==='priceDesc'?priceOf(b)-priceOf(a):a.name.localeCompare(b.name,'pt-BR'));
  if(!list.length){ $('grid').innerHTML='<div class="empty">Nenhum produto encontrado. <button class="btn ghost" type="button" id="clearQ">Limpar busca</button></div>'; const c=$('clearQ'); if(c) c.onclick=()=>{ $('q').value=''; kind='all'; render(); }; return; }
  $('grid').innerHTML=list.map(p=>{
    const v=priceOf(p), sv=kitSave(p), q=qtyOf(p.id), r=REV?resale(p).find(x=>!x.bad):null;
    return '<article class="card">'+
      '<button class="card-open" type="button" data-open="'+esc(p.id)+'" aria-label="Ver '+esc(p.name)+'">'+
        '<div class="thumb">'+img(p,true,true)+(isKit(p)?'<span class="badge kit">Kit · '+kitParts(p).length+' peças</span>':'')+(sv?'<span class="badge save">Economize '+BRL(sv)+'</span>':'')+'</div>'+
        '<div class="card-body"><div class="card-name">'+esc(p.name)+'</div>'+swatches(p)+
          '<div class="card-prices'+(REV?'':' one')+'"><div class="main"><small>'+T.price+'</small><b>'+(v?BRL(v):'Consulte')+'</b></div>'+
          (REV?'<div><small>Revenda no ML</small><b>'+(r?BRL(r.price):'—')+'</b></div>':'')+'</div></div>'+
      '</button>'+
      '<div class="card-actions">'+(q?stepper(p.id,q,p.name):'<button class="btn" type="button" data-add="'+esc(p.id)+'">Adicionar</button>')+
        '<a class="btn wa icon" href="'+esc(waLink(oneText(p,q||1)))+'" target="_blank" rel="noopener" aria-label="Pedir '+esc(p.name)+' pelo WhatsApp" title="Pedir pelo WhatsApp">'+WA_SVG+'</a></div>'+
    '</article>'; }).join('');
  $('grid').querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>go(el.dataset.open));
  bindSteppers($('grid'));
}

/* ficha do produto (endereço #p=id, o botão Voltar do celular fecha) */
let pushed=false;
function go(id){ const h="#p="+encodeURIComponent(id); if(location.hash===h) return openDetail(id); if(openId){ history.replaceState(null,"",h); openDetail(id); } else { pushed=true; location.hash=h; } }
function fromHash(){ const m=/^#p=(.+)$/.exec(location.hash), id=m?decodeURIComponent(m[1]):""; if(id&&byId(id)) openDetail(id); else { pushed=false; if(openId) closeDetail(true); } }
function openDetail(id){ const was=openId; openId=id; renderDetail(); $('ov').hidden=false; document.body.style.overflow='hidden'; $('detail').scrollTop=0; if(!was) setTimeout(()=>{const x=$('dClose'); if(x) x.focus();},0); }
function closeDetail(fromNav){ openId=null; $("ov").hidden=true; if($("bagOv").hidden) document.body.style.overflow=""; if(!fromNav&&/^#p=/.test(location.hash)){ if(pushed){ pushed=false; history.back(); } else history.replaceState(null,"",pageUrl()); } }
function renderDetail(){
  const p=byId(openId); if(!p) return closeDetail();
  const cat=D.catalogs.find(c=>c.id===p.catalogId), v=priceOf(p), q=qtyOf(p.id), sv=kitSave(p), sep=kitSeparate(p), pz=prazo(p), parts=kitParts(p);
  const dims=p.dims&&p.dims.length===3?p.dims.map(x=>(Math.round(x)/10).toLocaleString('pt-BR')).join(' × ')+' cm':'';
  const rs=REV?resale(p):[];
  $('detail').innerHTML=
  '<div class="sheet-head"><span class="tag" style="color:'+(cat?(CAT[cat.color]||CAT.teal):'inherit')+'">'+esc(cat?cat.name:'')+'</span>'+
    '<div class="head-actions"><button class="x" type="button" id="dShare" aria-label="Compartilhar este produto" title="Compartilhar">'+SHARE_SVG+'</button><button class="x" id="dClose" type="button" aria-label="Fechar">×</button></div></div>'+
  '<div class="sheet-body">'+
    '<section class="hero"><div class="thumb">'+img(p)+'</div>'+
      '<div class="hero-info"><h2 class="prod-name" id="dTitle">'+esc(p.name)+'</h2>'+
        '<div class="pricebox"><small>'+T.priceLong+'</small><div class="big">'+(v?'<span>R$ </span>'+NUM(v):'Consulte')+'</div>'+
          (sv?'<div class="savenote">Comprando as peças separadas: '+BRL(sep)+'. No kit você economiza '+BRL(sv)+'.</div>':'')+'</div>'+
        '<div class="buyrow">'+stepper(p.id,q||1,p.name).replace('data-dec="'+esc(p.id)+'"','data-dq="-1"').replace('data-inc="'+esc(p.id)+'"','data-dq="1"')+
          '<button class="btn" type="button" id="dAdd">'+(q?'Atualizar pedido':'Adicionar ao pedido')+'</button></div>'+
        '<a class="btn wa lg" id="dWa" target="_blank" rel="noopener">'+WA_SVG+'Pedir pelo WhatsApp</a>'+
        (q?'<p class="note" style="margin:0">Você já tem '+q+' no pedido. <button class="btn ghost" type="button" id="dSeeBag" style="padding:2px 6px;min-height:0">Ver pedido</button></p>':'')+
      '</div></section>'+
    (parts.length?'<section class="panel"><h3>O kit inclui</h3><div class="items">'+parts.map(x=>'<button class="item" type="button" data-open="'+esc(x.id)+'"><div class="thumb">'+img(x)+'</div><span>'+esc(x.name)+'</span>'+(priceOf(x)?'<small>'+BRL(priceOf(x))+' avulso</small>':'')+'</button>').join('')+'</div></section>':'')+
    (REV?'<section class="panel"><h3>Preço sugerido para revenda</h3><div class="tablewrap"><table class="prices"><thead><tr><th>Plataforma</th><th>Anunciar por</th><th>Taxas</th><th>Seu lucro</th></tr></thead><tbody>'+
      rs.map(r=>r.bad?'<tr><td>'+esc(r.pl.name)+'<small>'+esc(r.pl.sub)+'</small></td><td colspan="3">Consulte</td></tr>':
        '<tr><td>'+esc(r.pl.name)+'<small>'+esc(r.pl.sub)+'</small></td><td class="price">'+BRL(r.price)+'</td><td>'+BRL(r.fees)+'</td><td class="pos">'+BRL(r.profit)+'</td></tr>').join('')+
      '</tbody></table></div><p class="note">Calculado com as taxas de cada plataforma em novembro de 2026, mais '+BRL(+C.resalePack||0)+' de embalagem e envio, para você ficar com cerca de '+(C.resaleMargin||25)+'% de lucro sobre o preço de venda. Confira as taxas no painel de cada plataforma, pois mudam conforme a categoria.</p></section>':'')+
    '<section class="panel"><h3>Detalhes</h3><div class="kv">'+
      '<div><small>Material</small><b>'+esc(p.material||'PLA')+'</b></div>'+
      '<div><small>Cores</small><b>'+esc(p.colorText||'—')+'</b></div>'+
      (dims?'<div><small>Tamanho</small><b>'+esc(dims)+'</b></div>':'')+
      '<div><small>Produção</small><b>'+(pz?'Até '+pz+' dias úteis':'Sob encomenda')+'</b></div>'+
    '</div></section>'+
    (p.description?'<section class="panel"><h3>Descrição</h3><p class="desc">'+esc(p.description)+'</p></section>':'')+
  '</div>';
  let dq=q||1; const qs=$('detail').querySelector('.buyrow .stepper span');
  const upd=()=>{ qs.textContent=dq; $('dWa').href=waLink(oneText(p,dq)); };
  $('detail').querySelectorAll('[data-dq]').forEach(b=>b.onclick=()=>{ dq=Math.max(1,Math.min(999,dq+(+b.dataset.dq))); upd(); });
  upd();
  $('dAdd').onclick=()=>{ setQty(p.id,dq); toast(dq+'× no pedido'); };
  if($('dSeeBag')) $('dSeeBag').onclick=openBag;
  $('detail').querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>go(el.dataset.open));
  $('dClose').onclick=()=>closeDetail();
  $('dShare').onclick=async()=>{ const url=pageUrl()+'#p='+encodeURIComponent(p.id), text=p.name+(v?' — '+BRL(v):'');
    try{ if(navigator.share){ await navigator.share({title:p.name,text,url}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
    try{ await navigator.clipboard.writeText(url); toast('Link copiado'); }catch(e){ prompt('Copie o link:',url); } };
}

/* pedido: barra e painel */
function renderBag(){
  const n=bagCount(), tot=bagTotal();
  $('bagbar').hidden=!n; $('fab').hidden=!!n;
  if(n){ $('bagCount').textContent='Seu pedido · '+n+(n>1?' itens':' item'); $('bagTotal').textContent=tot?BRL(tot):'A combinar'; $('bagSendQuick').href=waLink(orderText(bagLines())); }
}
function openBag(){ renderBagSheet(); $('bagOv').hidden=false; document.body.style.overflow='hidden'; setTimeout(()=>{const x=$('bClose'); if(x) x.focus();},0); }
function closeBag(){ $('bagOv').hidden=true; if($('ov').hidden) document.body.style.overflow=''; }
let EXTRA={}; try{ EXTRA=JSON.parse(localStorage.getItem(T.key+'-dados')||'{}')||{}; }catch(e){}
function renderBagSheet(){
  const L=bagLines(), tot=bagTotal();
  $('bag').innerHTML='<div class="sheet-head"><span class="t" id="bTitle">Seu pedido</span><button class="x" id="bClose" type="button" aria-label="Fechar">×</button></div>'+
  '<div class="sheet-body">'+
   (L.length?'<div>'+L.map(x=>'<div class="bagitem">'+img(x.p,false)+'<div><div class="nm">'+esc(x.p.name)+'</div><div class="pr">'+(priceOf(x.p)?BRL(priceOf(x.p))+' cada'+(x.q>1?' · '+BRL(priceOf(x.p)*x.q):''):'Preço a combinar')+'</div></div>'+stepper(x.p.id,x.q,x.p.name)+'</div>').join('')+'</div>'+
     '<div class="total"><span>Total</span><span>'+(tot?BRL(tot):'A combinar')+'</span></div>'+
     '<label class="fl">Seu nome<input id="fName" autocomplete="name" value="'+esc(EXTRA.name||'')+'"></label>'+
     '<label class="fl">Cidade<input id="fCity" autocomplete="address-level2" value="'+esc(EXTRA.city||'')+'"></label>'+
     '<label class="fl">Observações (cores, data, retirada…)<textarea id="fObs" rows="3">'+esc(EXTRA.obs||'')+'</textarea></label>'+
     '<a class="btn wa lg" id="bSend" target="_blank" rel="noopener">'+WA_SVG+'Enviar pedido pelo WhatsApp</a>'+
     '<button class="btn plain" type="button" id="bClear">Esvaziar pedido</button>'+
     '<p class="note" style="margin:0">O pedido só é confirmado depois da conversa no WhatsApp. Cores, prazo e entrega são combinados por lá.</p>'
   :'<div class="empty">Seu pedido está vazio. Toque em <b>Adicionar</b> nos produtos para montar a lista.</div>')+
  '</div>';
  $('bClose').onclick=closeBag;
  bindSteppers($('bag'));
  if(!L.length) return;
  const sync=()=>{ EXTRA={name:$('fName').value.trim(),city:$('fCity').value.trim(),obs:$('fObs').value.trim()}; try{ localStorage.setItem(T.key+'-dados',JSON.stringify(EXTRA)); }catch(e){} $('bSend').href=waLink(orderText(bagLines(),EXTRA)); };
  ['fName','fCity','fObs'].forEach(i=>$(i).addEventListener('input',sync)); sync();
  $('bClear').onclick=()=>{ if(confirm('Tirar todos os itens do pedido?')){ BAG={}; saveBag(); render(); renderBag(); renderBagSheet(); } };
}

/* início */
$('h1').innerHTML=T.h1; $('sub').textContent=T.sub;
$('how').innerHTML=T.how.map((h,i)=>'<div><span class="n">'+(i+1)+'</span><span><b>'+h[0]+'</b>'+h[1]+'</span></div>').join('');
$('waTop').innerHTML=WA_SVG+'Falar no WhatsApp'; $('waTop').href=waLink(T.waTop);
$('fab').innerHTML=WA_SVG; $('fab').href=waLink(T.waTop);
$('bagOpen').onclick=openBag;
$('q').addEventListener('input',render); $('sort').addEventListener('change',render);
$('ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeDetail(); });
$('bagOv').addEventListener('click',e=>{ if(e.target.id==='bagOv') closeBag(); });
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(!$('bagOv').hidden) closeBag(); else if(!$('ov').hidden) closeDetail(); });
window.addEventListener('hashchange',fromHash);
$('foot').innerHTML='<span>Preços atualizados em '+new Date((D.updated||'')+'T12:00:00').toLocaleDateString('pt-BR')+'. Peças feitas sob encomenda em impressão 3D, podem ter pequenas marcas das camadas.</span><a href="'+esc(waLink(T.waTop))+'" target="_blank" rel="noopener">Dúvidas? Fale com a gente no WhatsApp</a>';
render(); renderBag(); fromHash(); loadPrices();
</script>
