<style>

  color-scheme:dark}}

.overlay{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(920px,100%);height:100%;overflow-y:auto;overscroll-behavior:contain;box-shadow:-8px 0 30px rgba(0,0,0,.15)}

.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:calc(env(safe-area-inset-top,0px) + 10px) 10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

.hero{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}

.gal{display:flex;flex-direction:column;gap:8px;min-width:0}

.gal-t.on{border-color:var(--accent);opacity:1}

.hero-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.prod-name{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,30px);line-height:1.1;letter-spacing:-.015em;margin:0;text-wrap:balance}

.big span{font-size:.45em;color:var(--muted);font-weight:600}
.savenote{margin-top:6px;font-size:13.5px;color:var(--gold);font-weight:600}
.buyrow{display:flex;gap:8px}
.buyrow .stepper{flex:0 0 132px;min-height:46px}
.buyrow .btn{flex:1;min-height:46px}

.varrow small{flex-basis:100%;color:var(--muted);font-size:12.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;box-sizing:border-box;min-height:44px;padding:6px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:600;display:flex;flex-direction:column;justify-content:center;line-height:1.2}

.seg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.seg button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;margin:0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.item{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.25;min-width:0}
.item .thumb{border-radius:8px;border:1px solid var(--line)}
.item small{color:var(--muted);font-family:var(--f-mono)}
.tablewrap{overflow-x:auto}
table.prices{border-collapse:collapse;width:100%;font-size:14px;min-width:440px}

.pos{color:var(--good)}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}

/* barra do pedido */

<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="h1"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <a class="btn wa" id="waTop" target="_blank" rel="noopener"></a>
  </header>
  <section class="how" id="how" aria-label="Como funciona"></section>
  <nav class="filters" id="filters" aria-label="Filtros"></nav>
  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="Buscar produto" aria-label="Buscar produto">
    <select class="sel" id="sort" aria-label="Ordenar">
      <option value="name">Nome A–Z</option>
      <option value="price">Menor preço</option>
      <option value="priceDesc">Maior preço</option>
    </select>
  </div>
  <section class="grid" id="grid" aria-live="polite"></section>
  <footer id="foot"></footer>
</div>

<div class="bagbar" id="bagbar" hidden>
  <div class="info"><span id="bagCount"></span><b id="bagTotal"></b></div>
  <button class="btn plain" type="button" id="bagOpen">Ver pedido</button>
  <a class="btn wa" id="bagSendQuick" target="_blank" rel="noopener">Enviar</a>
</div>
<a class="fab" id="fab" target="_blank" rel="noopener" aria-label="Falar no WhatsApp"></a>

<div class="overlay" id="ov" hidden><aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="dTitle" id="detail"></aside></div>
<div class="overlay" id="bagOv" hidden><aside class="sheet narrow" role="dialog" aria-modal="true" aria-labelledby="bTitle" id="bag"></aside></div>

<script>
const MODE="revenda";
const PHONE='5511954023947';
/* pagamento online (Mercado Pago, via Cloudflare Worker). Vazio = só pedido pelo WhatsApp */
const CHECKOUT_URL='https://catalogo-checkout.auditoredigitalsolutions.workers.dev';
const FRETE={sp:{label:'São Paulo (SP)',cost:13}};
const PAY=MODE==='vitrine'&&!!CHECKOUT_URL;
const WA_ORDER=!PAY; /* com pagamento no site, a vitrine não oferece pedido pelo WhatsApp (só "Falar no WhatsApp" para dúvidas) */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL=v=>(isFinite(v)?v:0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const NUM=v=>(isFinite(v)?v:0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const D=window.CATALOGO||{catalogs:[],products:[],config:{}}, C=D.config||{};
const REV = MODE==='revenda';

const WA_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>';

const isKit=p=>!!(p.kitItems&&p.kitItems.length);
/* produtos em que a pessoa escolhe a quantidade de partes (ex.: vila com N casinhas).
   Preço = linha do produto em precos.csv (vale para "def" partes) + linha "extra" por parte a mais ou a menos */
const VAR={'natal-vila-velas':{min:3,max:12,def:5,one:'casinha',many:'casinhas',label:'Casinhas',extra:'natal-vila-velas:casa'}};
/* opções escolhidas pelo cliente (modelo, tamanho, cor): campo "options" do produto em data.js,
   [{name, priced?, choices:[{id,label,hex?}]}]. No grupo com priced:true, cada opção usa a linha "id:opção" de precos.csv
   (sem linha, vale o preço do produto). A seleção é uma lista com o id escolhido em cada grupo. */
const OPT={}; D.products.forEach(p=>{ if(p.options&&p.options.length) OPT[p.id]=p.options; });
const pg=p=>(OPT[p.id]||[]).findIndex(o=>o.priced);
const choicePrice=(p,id)=>PRICES[p.id+':'+id]||PRICES[p.id]||0;
const optPrices=p=>{ const g=pg(p); return g<0?[PRICES[p.id]||0]:OPT[p.id][g].choices.map(c=>choicePrice(p,c.id)); };
const optPrice=(p,sel)=>{ const g=pg(p); return g<0?(PRICES[p.id]||0):choicePrice(p,sel[g]); };
const optDef=p=>OPT[p.id].map(o=>o.choices[0].id);
const optValid=(p,sel)=>Array.isArray(sel)&&sel.length===OPT[p.id].length&&OPT[p.id].every((o,i)=>o.choices.some(c=>c.id===sel[i]));
const optLabel=(p,sel)=>OPT[p.id].map((o,i)=>{ const c=o.choices.find(c=>c.id===sel[i]); return c?c.label:''; }).join(' · ');
const optFrom=p=>{ if(!OPT[p.id]) return false; const v=optPrices(p); return Math.min(...v)!==Math.max(...v); };
const optCta=p=>OPT[p.id].length===1?'Escolher '+OPT[p.id][0].name.toLowerCase():'Escolher opções';
const priceBase=(p,n)=>{ const b=PRICES[p.id]||0; if(OPT[p.id]){ if(n==null) return Math.min(...optPrices(p).filter(x=>x))||b; return optPrice(p,n); }
  const v=VAR[p.id]; if(!v||!b) return b; const e=PRICES[v.extra]||0; if(n==null) n=e?v.min:v.def; return Math.max(0,Math.round((b+(n-v.def)*e)*100)/100); };
/* adicional opcional (ex.: vela de LED): campo "addon" do produto em data.js, {id,label,no,yes,price,perPart?}.
   Preço na linha "id+addon" de precos.csv (sem linha, vale addon.price); perPart cobra por parte do VAR (vila: por casinha).
   No pedido a chave ganha "+addon" no fim (ex.: natal-vila-velas@5+vela). */
const ADD={}; D.products.forEach(p=>{ if(p.addon&&p.addon.id) ADD[p.id]=p.addon; });
const addPrice=p=>{ const a=ADD[p.id]; return a?(PRICES[p.id+'+'+a.id]||+a.price||0):0; };
const addTimes=(p,n)=>ADD[p.id]&&ADD[p.id].perPart&&VAR[p.id]?(typeof n==='number'?n:VAR[p.id].def):1;
const priceOf=(p,n,a)=>{ const b=priceBase(p,n); return a&&ADD[p.id]&&b?Math.round((b+addPrice(p)*addTimes(p,n))*100)/100:b; };
const addLabel=(p,a)=>ADD[p.id]?' · '+(a?ADD[p.id].yes:ADD[p.id].no):'';
const varName=(p,n,a)=>p.name+(n==null?'':OPT[p.id]?' — '+optLabel(p,n):VAR[p.id]?' — '+n+' '+VAR[p.id].many:'')+addLabel(p,a);

function toast(t){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=t; document.body.appendChild(el); clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),2200); }
function img(p,alt=true,lazy=false){ return '<img src="'+esc(p.image)+'" alt="'+(alt?esc(p.name):'')+'"'+(lazy?' loading="lazy"':'')+' decoding="async">'; }
function prazo(p){ const m=/Produ[cç][aã]o em at[eé] (\d+) dias? [uú]teis/i.exec(p.description||''); return m?+m[1]:0; }
function kitParts(p){ return isKit(p)?p.kitItems.map(byId).filter(Boolean):[]; }
function kitSeparate(p){ const ps=kitParts(p); if(!ps.length||ps.some(x=>!priceOf(x))) return 0; return ps.reduce((a,x)=>a+priceOf(x),0); }
function kitSave(p){ const s=kitSeparate(p), v=priceOf(p); return s&&v&&s-v>=1 ? s-v : 0; }
function swatches(p,max=8){ const c=(p.colors||[]).slice(0,max); return c.length?'<div class="swatches" aria-label="Cores: '+esc(p.colorText||'')+'">'+c.map(x=>'<span class="sw" style="background:'+esc(x)+'"></span>').join('')+'</div>':''; }

/* preços: planilha precos.csv (última coluna) */
async function loadPrices(){
  try{ const t=await fetch('precos.csv?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'');
    t.split(/\r?\n/).slice(1).forEach(l=>{ const p=l.split(';'); if(p.length<3) return; const v=parseFloat(p[p.length-1].trim().replace(/[R$\s]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.')); if(p[0].trim()&&isFinite(v)&&v>0) PRICES[p[0].trim()]=v; });
  }catch(e){}
  render(); renderBag(); if(openId) renderDetail();
}

/* revenda: preço sugerido por plataforma */
const P=v=>(+v||0)/100;
function platforms(){
  const ml=pct=>[{min:0,max:79,pct:P(pct),fix:+C.mlCustoOp||0},{min:79,max:Infinity,pct:P(pct),fix:+C.mlFrete||0}];
  const tk=(C.tkLow&&C.tkHigh)?[{min:0,max:50,pct:P(C.tkLow[0]),fix:+C.tkLow[1]},{min:50,max:Infinity,pct:P(C.tkHigh[0]),fix:+C.tkHigh[1]}]:[];
  return [
    {name:'Mercado Livre',sub:'Anúncio Clássico',tiers:ml(C.mlClassico),extra:0},
    {name:'Mercado Livre',sub:'Anúncio Premium (parcelado)',tiers:ml(C.mlPremium),extra:0},
    {name:'Shopee',sub:'Comissão + tarifa por item',tiers:(C.sh||[]).map(t=>({min:t[0],max:t[1]>=1e9?Infinity:t[1],pct:P(t[2]),fix:+t[3]})),extra:0},
    {name:'TikTok Shop',sub:'Comissão + programa de frete',tiers:tk,extra:P(C.tkFrete)},
  ].filter(x=>x.tiers.length);
}
const round90=p=>Math.ceil(p+0.10)-0.10;
function resale(p,n,a){
  const cost=priceOf(p,n,a)+(+C.resalePack||0), m=P(C.resaleMargin||25);
  return platforms().map(pl=>{
    const c=[]; for(const t of pl.tiers){ const den=1-t.pct-pl.extra-m; if(den<=0.01) continue; const v=(cost+t.fix)/den; if(v>=t.min&&v<t.max) c.push(v); else if(v<t.min) c.push(t.min); }
    if(!c.length||!priceOf(p)) return {pl,bad:true};
    const price=round90(Math.min(...c)), t=pl.tiers.find(t=>price>=t.min&&price<t.max)||pl.tiers[pl.tiers.length-1];
    const fees=price*(t.pct+pl.extra)+t.fix, profit=price-fees-cost;
    return {pl,price,fees,profit};
  });
}

let BAG={};

function saveBag(){ try{ localStorage.setItem(T.key,JSON.stringify(BAG)); }catch(e){} }
function qtyOf(id){ return BAG[id]||0; }
function setQty(id,q){ q=Math.max(0,Math.min(999,Math.round(q)||0)); if(q) BAG[id]=q; else delete BAG[id]; saveBag(); render(); renderBag(); if(openId) renderDetail(); if(!$('bagOv').hidden) renderBagSheet(); }
function bagLines(){ return Object.keys(BAG).map(k=>{ const am=/^(.+)\+([a-z0-9-]+)$/.exec(k), k0=am?am[1]:k, m=/^(.+?)([@~])(.+)$/.exec(k0), id=m?m[1]:k0, n=m?(m[2]==='@'?+m[3]:m[3].split('|')):null, p=byId(id); return {k,p,n,a:!!am,ok:!am||!!(p&&ADD[p.id]&&ADD[p.id].id===am[2]),q:BAG[k]}; }).filter(x=>x.p&&x.ok&&x.q>0&&(OPT[x.p.id]?optValid(x.p,x.n):VAR[x.p.id]?typeof x.n==='number':x.n==null)); }
function bagTotal(){ return bagLines().reduce((a,x)=>a+priceOf(x.p,x.n,x.a)*x.q,0); }
function bagCount(){ return bagLines().reduce((a,x)=>a+x.q,0); }
function orderText(lines, extra){
  const L=lines.map(x=>{ const v=priceOf(x.p,x.n,x.a); return '• '+x.q+'x '+varName(x.p,x.n,x.a)+(v?' — '+BRL(v)+(x.q>1?' cada = '+BRL(v*x.q):''):''); });
  const tot=lines.reduce((a,x)=>a+priceOf(x.p,x.n,x.a)*x.q,0);
  let t=T.orderHead+'\n\n'+L.join('\n')+(tot?'\n\nTotal: '+BRL(tot):'');
  if(extra&&extra.name) t+='\n\nNome: '+extra.name;
  if(extra&&extra.phone) t+='\nWhatsApp: '+extra.phone;
  if(extra&&extra.addr) t+='\nEndereço: '+extra.addr+(extra.cep?' — CEP '+extra.cep:'');
  if(extra&&extra.city) t+='\nCidade: '+extra.city;
  if(extra&&extra.ship) t+='\nEntrega: '+(FRETE[extra.ship]?FRETE[extra.ship].label+' — frete '+BRL(FRETE[extra.ship].cost):'fora de SP, frete a combinar');
  if(extra&&extra.obs) t+='\nObservações: '+extra.obs;
  if(extra&&extra.paid) t+='\n\nPedido '+extra.paid+' pago pelo site (Mercado Pago).';
  return t+'\n\nCatálogo: '+pageUrl();
}
function oneText(p,q,n,a){ return orderText([{p,q:q||1,n:n==null?null:n,a:!!a}]).replace(T.orderHead, REV?'Olá! Sou revendedor e tenho interesse em:':'Olá! Tenho interesse em:')+'\nPode me passar cores e prazo?'; }
function stepper(id,q,label){ return '<div class="stepper" role="group" aria-label="Quantidade de '+esc(label)+'"><button type="button" data-dec="'+esc(id)+'" aria-label="Diminuir">−</button><span aria-live="polite">'+q+'</span><button type="button" data-inc="'+esc(id)+'" aria-label="Aumentar">+</button></div>'; }
function bindSteppers(root){
  root.querySelectorAll('[data-inc]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); setQty(b.dataset.inc,qtyOf(b.dataset.inc)+1); });
  root.querySelectorAll('[data-dec]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); setQty(b.dataset.dec,qtyOf(b.dataset.dec)-1); });
  root.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); setQty(b.dataset.add,qtyOf(b.dataset.add)+1); toast('Adicionado ao pedido'); });

          (c.hex?'<span class="sw" style="background:'+esc(c.hex)+'"></span>':'')+'<span>'+esc(c.label)+(o.priced&&optFrom(p)?'<small>'+BRL(choicePrice(p,c.id))+'</small>':'')+'</span></button>').join('')+'</div></div>').join(''):'')+
        (ad?'<div class="varrow"><b>'+esc(ad.label)+'</b><div class="seg" role="group" aria-label="'+esc(ad.label)+'"><button type="button" data-ad="0" aria-pressed="'+!da+'"><span>'+esc(ad.no)+'</span></button><button type="button" data-ad="1" aria-pressed="'+da+'"><span>'+esc(ad.yes)+'<small>+ '+BRL(addPrice(p))+(ad.perPart&&vv?' por '+esc(vv.one):'')+'</small></span></button></div></div>':'')+
        '<div class="buyrow">'+stepper(p.id,q||1,p.name).replace('data-dec="'+esc(p.id)+'"','data-dq="-1"').replace('data-inc="'+esc(p.id)+'"','data-dq="1"')+
          '<button class="btn" type="button" id="dAdd">'+(q?'Atualizar pedido':'Adicionar ao pedido')+'</button></div>'+
        (WA_ORDER?'<a class="btn wa lg" id="dWa" target="_blank" rel="noopener">'+WA_SVG+'Pedir pelo WhatsApp</a>':'')+
        (q?'<p class="note" style="margin:0">Você já tem '+q+' no pedido. <button class="btn ghost" type="button" id="dSeeBag" style="padding:2px 6px;min-height:0">Ver pedido</button></p>':'')+
      '</div></section>'+
    (parts.length?'<section class="panel"><h3>O kit inclui</h3><div class="items">'+parts.map(x=>'<button class="item" type="button" data-open="'+esc(x.id)+'"><div class="thumb">'+img(x)+'</div><span>'+esc(x.name)+'</span>'+(priceOf(x)?'<small>'+BRL(priceOf(x))+' avulso</small>':'')+'</button>').join('')+'</div></section>':'')+
    (REV?'<section class="panel"><h3>Preço sugerido para revenda</h3><div class="tablewrap"><table class="prices"><thead><tr><th>Plataforma</th><th>Anunciar por</th><th>Taxas</th><th>Seu lucro</th></tr></thead><tbody>'+
      rs.map(r=>r.bad?'<tr><td>'+esc(r.pl.name)+'<small>'+esc(r.pl.sub)+'</small></td><td colspan="3">Consulte</td></tr>':
        '<tr><td>'+esc(r.pl.name)+'<small>'+esc(r.pl.sub)+'</small></td><td class="price">'+BRL(r.price)+'</td><td>'+BRL(r.fees)+'</td><td class="pos">'+BRL(r.profit)+'</td></tr>').join('')+
      '</tbody></table></div><p class="note">Calculado com as taxas de cada plataforma em novembro de 2026, mais '+BRL(+C.resalePack||0)+' de embalagem e envio, para você ficar com cerca de '+(C.resaleMargin||25)+'% de lucro sobre o preço de venda. Confira as taxas no painel de cada plataforma, pois mudam conforme a categoria.</p></section>':'')+
    '<section class="panel"><h3>Detalhes</h3><div class="kv">'+
      '<div><small>Material</small><b>'+esc(p.material||'PLA')+'</b></div>'+
      '<div><small>Cores</small><b>'+esc(p.colorText||'—')+'</b></div>'+
      (dims?'<div><small>Tamanho</small><b>'+esc(dims)+'</b></div>':'')+
      '<div><small>Produção</small><b>'+(pz?'Até '+pz+' dias úteis':'Sob encomenda')+'</b></div>'+
    '</div></section>'+
    (p.description?'<section class="panel"><h3>Descrição</h3><p class="desc">'+esc(p.description)+'</p></section>':'')+
  '</div>';
  let dq=q||1; const qs=$('detail').querySelector('.buyrow .stepper span');
  const upd=()=>{ qs.textContent=dq; if($('dWa')) $('dWa').href=waLink(oneText(p,dq,dn,da)); };
  $('detail').querySelectorAll('[data-dq]').forEach(b=>b.onclick=()=>{ dq=Math.max(1,Math.min(999,dq+(+b.dataset.dq))); upd(); });
  upd();
  $('dAdd').onclick=()=>{ setQty(key,dq); toast(dq+'× no pedido'); };
  $('detail').querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{ const f=b.dataset.dn; DN[p.id]=Math.max(vv.min,Math.min(vv.max,dn+(+f))); renderDetail(); const nb=$('detail').querySelector('[data-dn="'+f+'"]'); if(nb) nb.focus(); });
  $('detail').querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{ const g=+b.dataset.og, k=b.dataset.opt, s=dn.slice(); s[g]=k; DN[p.id]=s; renderDetail(); const nb=$('detail').querySelector('[data-og="'+g+'"][data-opt="'+CSS.escape(k)+'"]'); if(nb) nb.focus(); });
  $('detail').querySelectorAll('[data-ad]').forEach(b=>b.onclick=()=>{ const k=b.dataset.ad; DA[p.id]=k==='1'; renderDetail(); const nb=$('detail').querySelector('[data-ad="'+k+'"]'); if(nb) nb.focus(); });
  if($('dSeeBag')) $('dSeeBag').onclick=openBag;
  $('detail').querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>go(el.dataset.open));
  $('dClose').onclick=()=>closeDetail();
  $('detail').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ $('dMain').querySelector('img').src=G[+b.dataset.g]; $('detail').querySelectorAll('[data-g]').forEach(x=>{ x.classList.toggle('on',x===b); x.setAttribute('aria-pressed',x===b); }); });
  $('dShare').onclick=async()=>{ const url=pageUrl()+'#p='+encodeURIComponent(p.id), text=p.name+(v?' — '+BRL(v):'');
    try{ if(navigator.share){ await navigator.share({title:p.name,text,url}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
    try{ await navigator.clipboard.writeText(url); toast('Link copiado'); }catch(e){ prompt('Copie o link:',url); } };
}

/* pedido: barra e painel */
function renderBag(){
  const n=bagCount(), tot=bagTotal();
  $('bagbar').hidden=!n; $('fab').hidden=!!n;
  if(n){ $('bagCount').textContent='Seu pedido · '+n+(n>1?' itens':' item'); $('bagTotal').textContent=tot?BRL(tot):'A combinar'; const sq=$('bagSendQuick'); if(WA_ORDER) sq.href=waLink(orderText(bagLines())); else { sq.removeAttribute('href'); sq.removeAttribute('target'); sq.className='btn'; sq.textContent='Pagar'; sq.setAttribute('role','button'); sq.onclick=e=>{ e.preventDefault(); openBag(); }; } }
}
function openBag(){ renderBagSheet(); $('bagOv').hidden=false; document.body.style.overflow='hidden'; setTimeout(()=>{const x=$('bClose'); if(x) x.focus();},0); }
function closeBag(){ $('bagOv').hidden=true; if($('ov').hidden) document.body.style.overflow=''; }
let EXTRA={}; try{ EXTRA=JSON.parse(localStorage.getItem(T.key+'-dados')||'{}')||{}; }catch(e){}
function renderBagSheet(){
  const L=bagLines(), tot=bagTotal();
  $('bag').innerHTML='<div class="sheet-head"><span class="t" id="bTitle">Seu pedido</span><button class="x" id="bClose" type="button" aria-label="Fechar">×</button></div>'+
  '<div class="sheet-body">'+
   (L.length?'<div>'+L.map(x=>{ const v=priceOf(x.p,x.n,x.a); return '<div class="bagitem">'+img(x.p,false)+'<div><div class="nm">'+esc(varName(x.p,x.n,x.a))+'</div><div class="pr">'+(v?BRL(v)+' cada'+(x.q>1?' · '+BRL(v*x.q):''):'Preço a combinar')+'</div></div>'+stepper(x.k,x.q,varName(x.p,x.n,x.a))+'</div>'; }).join('')+'</div>'+
     (PAY?'<div class="subt"><span>Produtos</span><span>'+BRL(tot)+'</span></div><div class="subt" id="bFreteRow"><span>Frete</span><span id="bFrete"></span></div>':'')+
     '<div class="total"><span>Total</span><span id="bTot">'+(tot?BRL(tot):'A combinar')+'</span></div>'+
     '<label class="fl">Seu nome<input id="fName" autocomplete="name" value="'+esc(EXTRA.name||'')+'"></label>'+
     (PAY?'<label class="fl">WhatsApp (com DDD)<input id="fPhone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="11 91234-5678" value="'+esc(EXTRA.phone||'')+'"></label>'+
       '<label class="fl">Entrega<select id="fShip" class="sel">'+Object.keys(FRETE).map(k=>'<option value="'+k+'">'+esc(FRETE[k].label)+' — frete '+BRL(FRETE[k].cost)+'</option>').join('')+(WA_ORDER?'<option value="outro">Outro estado — frete combinado no WhatsApp</option>':'')+'</select></label>'+
       '<label class="fl">CEP<input id="fCep" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000" maxlength="9" value="'+esc(EXTRA.cep||'')+'"></label>'+
       '<label class="fl">Endereço (rua, número, complemento e bairro)<input id="fAddr" autocomplete="street-address" value="'+esc(EXTRA.addr||'')+'"></label>':'')+
     '<label class="fl">Cidade<input id="fCity" autocomplete="address-level2" value="'+esc(EXTRA.city||'')+'"></label>'+
     '<label class="fl">Observações (cores, data, retirada…)<textarea id="fObs" rows="3">'+esc(EXTRA.obs||'')+'</textarea></label>'+
     (PAY?'<button class="btn lg" type="button" id="bPay">Pagar com Pix ou cartão</button><p class="note" id="bPayNote" style="margin:0"></p>':'')+
     (WA_ORDER?'<a class="btn wa lg" id="bSend" target="_blank" rel="noopener">'+WA_SVG+'Enviar pedido pelo WhatsApp</a>':'')+
     '<button class="btn plain" type="button" id="bClear">Esvaziar pedido</button>'+
     '<p class="note" style="margin:0">'+(PAY?'Entregamos no estado de São Paulo. Depois do pagamento, o pedido entra na fila de produção e falamos com você pelo WhatsApp informado.':'O pedido só é confirmado depois da conversa no WhatsApp. Cores, prazo e entrega são combinados por lá.')+'</p>'
   :'<div class="empty">Seu pedido está vazio. Toque em <b>Adicionar</b> nos produtos para montar a lista.</div>')+
  '</div>';
  $('bClose').onclick=closeBag;
  bindSteppers($('bag'));
  if(!L.length) return;
  if(PAY&&EXTRA.ship) $('fShip').value=FRETE[EXTRA.ship]||EXTRA.ship==='outro'?EXTRA.ship:'sp';
  const sync=()=>{ EXTRA={name:$('fName').value.trim(),city:$('fCity').value.trim(),obs:$('fObs').value.trim()};
    if(PAY){ Object.assign(EXTRA,{phone:$('fPhone').value.trim(),cep:$('fCep').value.trim(),addr:$('fAddr').value.trim(),ship:$('fShip').value});
      const f=FRETE[EXTRA.ship]; $('bFrete').textContent=f?BRL(f.cost):'a combinar'; $('bTot').textContent=f?BRL(tot+f.cost):BRL(tot)+' + frete';
      $('bPay').hidden=!f; $('bPayNote').textContent=f?'Você vai para a página segura do Mercado Pago. Pix ou cartão em até 6x.':''; }
    try{ localStorage.setItem(T.key+'-dados',JSON.stringify(EXTRA)); }catch(e){} if($('bSend')) $('bSend').href=waLink(orderText(bagLines(),EXTRA)); };
  ['fName','fCity','fObs','fPhone','fCep','fAddr'].forEach(i=>{ if($(i)) $(i).addEventListener('input',sync); }); if(PAY) $('fShip').addEventListener('change',sync); sync();
  if(PAY) $('bPay').onclick=pay;
  $('bClear').onclick=()=>{ if(confirm('Tirar todos os itens do pedido?')){ BAG={}; saveBag(); render(); renderBag(); renderBagSheet(); } };
}

/* pagamento online */
async function pay(){
  const b=$('bPay'), note=$('bPayNote'), E=EXTRA, digits=s=>(s||'').replace(/\D/g,'');
  const miss=[]; if(!E.name) miss.push('nome'); if(digits(E.phone).length<10) miss.push('WhatsApp com DDD'); if(digits(E.cep).length!==8) miss.push('CEP'); if(!E.addr) miss.push('endereço');
  if(miss.length){ note.textContent='Preencha: '+miss.join(', ')+'.'; return; }
  b.disabled=true; b.textContent='Abrindo o pagamento…'; note.textContent='';
  try{
    const items=bagLines().map(x=>({id:x.p.id,n:x.n,q:x.q,a:x.a}));
    const r=await fetch(CHECKOUT_URL.replace(/\/$/,'')+'/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items,ship:E.ship,buyer:{name:E.name,phone:digits(E.phone),cep:digits(E.cep),address:E.addr,city:E.city,obs:E.obs}})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.url) throw new Error(j.error||'Não foi possível abrir o pagamento.');
    try{ localStorage.setItem(T.key+'-pago',JSON.stringify({ref:j.ref,text:orderText(bagLines(),Object.assign({},E,{paid:j.ref}))})); }catch(e){}
    location.href=j.url;
  }catch(e){ b.disabled=false; b.textContent='Pagar com Pix ou cartão'; note.textContent=(e.message||'Erro.')+' Tente de novo em instantes.'; }
}
function payReturn(){
  const qs=new URLSearchParams(location.search), st=qs.get('pg'); if(!st) return;
  let saved={}; try{ saved=JSON.parse(localStorage.getItem(T.key+'-pago')||'{}')||{}; }catch(e){}
  const ref=qs.get('external_reference')||saved.ref||'', ok=st==='ok'&&(qs.get('collection_status')||qs.get('status')||'approved')==='approved', pend=st==='pendente'||qs.get('collection_status')==='pending'||qs.get('collection_status')==='in_process';
  const text=(saved.text||('Olá! Fiz o pedido '+ref+' pelo site.'));
  history.replaceState(null,'',location.pathname+location.hash);
  if(ok){ BAG={}; saveBag(); try{ localStorage.removeItem(T.key+'-pago'); }catch(e){} render(); renderBag(); }
  $('bag').innerHTML='<div class="sheet-head"><span class="t" id="bTitle">'+(ok?'Pagamento aprovado!':pend?'Pagamento em análise':'Pagamento não concluído')+'</span><button class="x" id="bClose" type="button" aria-label="Fechar">×</button></div>'+
    '<div class="sheet-body"><p style="margin:0">'+(ok?'Obrigado! Seu pedido <b>'+esc(ref)+'</b> foi pago e já entrou na fila de produção. Toque no botão abaixo para nos enviar os dados da entrega pelo WhatsApp.':
      pend?'O Mercado Pago ainda está confirmando o pagamento do pedido <b>'+esc(ref)+'</b>. Assim que aprovar, o pedido entra na fila de produção.':
      'O pagamento não foi concluído e nada foi cobrado. Seu pedido continua salvo aqui para você tentar de novo.')+'</p>'+
    (ok||pend?'<a class="btn wa lg" target="_blank" rel="noopener" href="'+esc(waLink(text))+'">'+WA_SVG+'Enviar dados da entrega pelo WhatsApp</a>':'<button class="btn lg" type="button" id="bBack">Tentar de novo</button>')+'</div>';
  $('bClose').onclick=closeBag; if($('bBack')) $('bBack').onclick=renderBagSheet;
  $('bagOv').hidden=false; document.body.style.overflow='hidden';
}

/* início */
$('h1').innerHTML=T.h1; $('sub').textContent=T.sub;
$('how').innerHTML=T.how.map((h,i)=>'<div><span class="n">'+(i+1)+'</span><span><b>'+h[0]+'</b>'+h[1]+'</span></div>').join('');
$('waTop').innerHTML=WA_SVG+'Falar no WhatsApp'; $('waTop').href=waLink(T.waTop);
$('fab').innerHTML=WA_SVG; $('fab').href=waLink(T.waTop);
$('bagOpen').onclick=openBag;
$('q').addEventListener('input',render); $('sort').addEventListener('change',render);
$('ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeDetail(); });
$('bagOv').addEventListener('click',e=>{ if(e.target.id==='bagOv') closeBag(); });
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(!$('bagOv').hidden) closeBag(); else if(!$('ov').hidden) closeDetail(); });
window.addEventListener('hashchange',fromHash);
$('foot').innerHTML='<span>Preços atualizados em '+new Date((D.updated||'')+'T12:00:00').toLocaleDateString('pt-BR')+'. Peças feitas sob encomenda em impressão 3D, podem ter pequenas marcas das camadas.</span><a href="'+esc(waLink(T.waTop))+'" target="_blank" rel="noopener">Dúvidas? Fale com a gente no WhatsApp</a>';
render(); renderBag(); fromHash(); loadPrices(); payReturn();
</script>
